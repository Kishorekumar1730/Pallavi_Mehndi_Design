<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="50%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#EADBCE" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Subtle ornamental border -->
  <rect x="24" y="24" width="752" height="952" rx="16" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <rect x="36" y="36" width="728" height="928" rx="12" fill="none" stroke="#B35D4D" stroke-width="1" opacity="0.3" />

  <!-- Corner Henna Flourishes -->
  <g fill="none" stroke="#B35D4D" stroke-width="1.2" opacity="0.5">
    <path d="M48 90 C 70 90, 90 70, 90 48" />
    <path d="M48 110 C 90 110, 110 90, 110 48" />
    <circle cx="95" cy="95" r="4" fill="#C5A059" />

    <path d="M752 90 C 730 90, 710 70, 710 48" />
    <path d="M752 110 C 710 110, 690 90, 690 48" />
    <circle cx="705" cy="95" r="4" fill="#C5A059" />

    <path d="M48 910 C 70 910, 90 930, 90 952" />
    <path d="M48 890 C 90 890, 110 910, 110 952" />
    <circle cx="95" cy="905" r="4" fill="#C5A059" />

    <path d="M752 910 C 730 910, 710 930, 710 952" />
    <path d="M752 890 C 710 890, 690 910, 690 952" />
    <circle cx="705" cy="905" r="4" fill="#C5A059" />
  </g>

  <!-- Central Mandala Art -->
  <g transform="translate(400, 380)">
    <!-- Radiating Mandala -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#B35D4D" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="100" fill="#FAF5EE" stroke="#C5A059" stroke-width="2" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#8F3D30" stroke-width="1.5" stroke-dasharray="2 3" />
    <circle cx="0" cy="0" r="40" fill="#FAF5EE" stroke="#C5A059" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="url(#goldGrad)" />

    <!-- 16 Petals -->
    <g fill="#B35D4D" fill-opacity="0.12" stroke="#8F3D30" stroke-width="1.2">
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" />
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" transform="rotate(45)" />
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" transform="rotate(90)" />
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" transform="rotate(135)" />
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" transform="rotate(180)" />
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" transform="rotate(225)" />
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" transform="rotate(270)" />
      <path d="M0 -40 C -15 -70, -15 -100, 0 -130 C 15 -100, 15 -70, 0 -40 Z" transform="rotate(315)" />
    </g>

    <!-- Outer Lotus Accents -->
    <g fill="none" stroke="#C5A059" stroke-width="1.5">
      <circle cx="0" cy="-160" r="5" fill="#C5A059" />
      <circle cx="160" cy="0" r="5" fill="#C5A059" />
      <circle cx="0" cy="160" r="5" fill="#C5A059" />
      <circle cx="-160" cy="0" r="5" fill="#C5A059" />
      <circle cx="113" cy="113" r="4" fill="#8F3D30" />
      <circle cx="-113" cy="113" r="4" fill="#8F3D30" />
      <circle cx="113" cy="-113" r="4" fill="#8F3D30" />
      <circle cx="-113" cy="-113" r="4" fill="#8F3D30" />
    </g>
  </g>

  <!-- Text and Labels -->
  <g text-anchor="middle" font-family="'Playfair Display', Georgia, serif">
    <!-- Category Tag -->
    <rect x="260" y="610" width="280" height="36" rx="18" fill="#FAF5EE" stroke="#C5A059" stroke-width="1" />
    <text x="400" y="633" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8F3D30" letter-spacing="2">
      BRIDAL ARTISTRY SHOWCASE
    </text>

    <!-- Main Title -->
    <text x="400" y="690" font-size="28" font-weight="700" fill="#241416">
      Royal Heritage Bridal Palms
    </text>

    <!-- Notice Box -->
    <rect x="150" y="725" width="500" height="110" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#EADBCE" stroke-width="1" />
    <text x="400" y="755" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#B35D4D" letter-spacing="1.5">
      ★ VERIFIED PORTFOLIO PLACEHOLDER
    </text>
    <text x="400" y="782" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#241416" fill-opacity="0.8">
      Awaiting direct photo upload from
    </text>
    <text x="400" y="804" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#241416">
      @salem_mehandi_artist_pallavi
    </text>

    <!-- Sub note -->
    <text x="400" y="865" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#241416" fill-opacity="0.6">
      Replaceable in Admin Dashboard → Portfolio Management
    </text>
  </g>
</svg>