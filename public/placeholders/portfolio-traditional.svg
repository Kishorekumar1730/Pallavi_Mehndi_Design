<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="50%" stop-color="#F3E9DD" />
      <stop offset="100%" stop-color="#E5D3BF" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <!-- Geometric Jaal Grid Pattern -->
    <pattern id="jaalPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 L 40 20 L 20 40 Z" fill="none" stroke="#C5A059" stroke-width="1" opacity="0.4" />
      <circle cx="20" cy="20" r="2.5" fill="#8F3D30" opacity="0.6" />
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad3)" />
  <rect x="24" y="24" width="752" height="952" rx="16" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <rect x="36" y="36" width="728" height="928" rx="12" fill="none" stroke="#B35D4D" stroke-width="1" opacity="0.3" />

  <!-- Traditional Jaal & Kalash Medallion -->
  <g transform="translate(400, 370)">
    <!-- Jaal Medallion Circle -->
    <circle cx="0" cy="0" r="140" fill="url(#jaalPattern)" stroke="#B35D4D" stroke-width="2" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Center Kalash Motif -->
    <g transform="translate(0, 10)">
      <circle cx="0" cy="0" r="50" fill="#FAF5EE" stroke="#8F3D30" stroke-width="2" />
      <path d="M-25 15 C -25 35, 25 35, 25 15 L 20 -15 L -20 -15 Z" fill="#B35D4D" fill-opacity="0.3" stroke="#8F3D30" stroke-width="1.5" />
      <!-- Coconut & Mango Leaves -->
      <circle cx="0" cy="-22" r="12" fill="url(#goldGrad3)" />
      <path d="M-15 -18 C -25 -35, -5 -40, 0 -22" fill="none" stroke="#8F3D30" stroke-width="1.5" />
      <path d="M15 -18 C 25 -35, 5 -40, 0 -22" fill="none" stroke="#8F3D30" stroke-width="1.5" />
    </g>
  </g>

  <!-- Text and Labels -->
  <g text-anchor="middle" font-family="'Playfair Display', Georgia, serif">
    <rect x="240" y="610" width="320" height="36" rx="18" fill="#FAF5EE" stroke="#C5A059" stroke-width="1" />
    <text x="400" y="633" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8F3D30" letter-spacing="2">
      TRADITIONAL RAJASTHANI &amp; SOUTH
    </text>

    <text x="400" y="690" font-size="28" font-weight="700" fill="#241416">
      Intricate Jaal &amp; Temple Motifs
    </text>

    <rect x="150" y="725" width="500" height="110" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#EADBCE" stroke-width="1" />
    <text x="400" y="755" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#B35D4D" letter-spacing="1.5">
      ★ VERIFIED PORTFOLIO PLACEHOLDER
    </text>
    <text x="400" y="782" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#241416" fill-opacity="0.8">
      Awaiting direct photo upload from
    </text>
    <text x="400" y="804" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#241416">
      @salem_mehandi_artist_pallavi
    </text>

    <text x="400" y="865" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#241416" fill-opacity="0.6">
      Replaceable in Admin Dashboard → Portfolio Management
    </text>
  </g>
</svg>