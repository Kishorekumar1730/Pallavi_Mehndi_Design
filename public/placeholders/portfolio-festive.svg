    <path d="M-60 -100 C -140 -20, -100 80, 0 120 C -70 80, -90 -20, -60 -100 Z" fill="#FAF5EE" stroke="#C5A059" stroke-width="2" />
    
    <!-- Blooming Lotus Radiance -->
    <g transform="translate(10, 0)">
      <circle cx="0" cy="0" r="60" fill="#FAF5EE" stroke="#B35D4D" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="url(#goldGrad5)" />

      <!-- Radiating Petals -->
      <g fill="#B35D4D" fill-opacity="0.2" stroke="#8F3D30" stroke-width="1.5">
