        <path d="M42 -42 C 70 -70, 90 -40, 42 -42 Z" />
        <path d="M60 0 C 95 -20, 95 20, 60 0 Z" />
        <path d="M42 42 C 70 70, 40 90, 42 42 Z" />
        <path d="M0 60 C -20 95, 20 95, 0 60 Z" />
        <path d="M-42 42 C -70 70, -40 90, -42 42 Z" />
        <path d="M-60 0 C -95 -20, -95 20, -60 0 Z" />
        <path d="M-42 -42 C -70 -70, -90 -40, -42 -42 Z" />
      </g>
    </g>
  </g>

