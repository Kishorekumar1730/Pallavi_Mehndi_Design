<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="artistFrameBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#F2E8DC" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#artistFrameBg)" />
  <rect x="28" y="28" width="744" height="944" rx="16" fill="none" stroke="#EADBCE" stroke-width="2" />
  <rect x="36" y="36" width="728" height="928" rx="12" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Clean Monogram Frame -->
  <g transform="translate(400, 330)">
    <circle cx="0" cy="0" r="90" fill="#FFFFFF" stroke="#C5A059" stroke-width="2" />
    <circle cx="0" cy="0" r="78" fill="#FAF5EE" stroke="#EADBCE" stroke-width="1" />
    <text x="0" y="24" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="76" font-weight="700" fill="#8F3D30">
      P
    </text>
  </g>

  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
    <rect x="230" y="460" width="340" height="34" rx="17" fill="#FAF5EE" stroke="#C5A059" stroke-width="1.2" />
    <text x="400" y="482" font-size="12" font-weight="700" fill="#8F3D30" letter-spacing="1.5">
      PROFESSIONAL MEHANDI ARTIST
    </text>

    <text x="400" y="545" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#241416">
      Pallavi
    </text>

    <text x="400" y="585" font-size="14" font-weight="600" fill="#8F3D30" letter-spacing="0.5">
