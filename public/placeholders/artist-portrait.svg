    <!-- Verified Instagram Box -->
    <g transform="translate(160, 690)">
      <rect x="0" y="0" width="480" height="120" rx="16" fill="#FFFFFF" stroke="#EADBCE" stroke-width="1.5" />
      <text x="240" y="36" font-size="12" font-weight="700" fill="#8F3D30" letter-spacing="1">
        OFFICIAL INSTAGRAM PROFILE REFERENCE
      </text>
      <text x="240" y="68" font-size="18" font-weight="700" fill="#241416">
        @salem_mehandi_artist_pallavi
      </text>
      <text x="240" y="96" font-size="12" fill="#241416" fill-opacity="0.6">
        Visit Instagram for live client photos, reels, and highlights
      </text>
    </g>

    <text x="400" y="865" font-size="12" fill="#241416" fill-opacity="0.5">
      Owner: Upload genuine portrait or studio photo in Admin Settings
    </text>
